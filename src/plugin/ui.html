<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Website to Figma · Hla.Sh</title>
    <style>
      :root {
        font:
          13px/1.5 Inter,
          'Segoe UI',
          sans-serif;
        color-scheme: light dark;
        --bg: var(--figma-color-bg, #fafbf9);
        --text: var(--figma-color-text, #25372d);
        --muted: var(--figma-color-text-secondary, #728078);
        --line: var(--figma-color-border, #dce2dd);
        --field: var(--figma-color-bg-secondary, #f0f3ef);
        --accent: #365e43;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 22px 16px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        font-size: 14px;
        font-weight: 650;
        direction: ltr;
      }
      .by {
        font-size: 11px;
        color: var(--muted);
        direction: ltr;
        margin-top: 3px;
      }
      .mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 20px;
      }
      main {
        padding: 20px 22px 12px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 5px;
        letter-spacing: -0.4px;
      }
      p {
        color: var(--muted);
        margin: 0 0 16px;
        font-size: 12px;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0;
        min-width: 0;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 550;
        margin-bottom: 6px;
      }
      input,
      select,
      button {
        font: inherit;
        border-radius: 7px;
      }
      input,
      select {
        width: 100%;
        border: 1px solid var(--line);
        padding: 10px 11px;
        background: var(--field);
        color: var(--text);
        height: 41px;
      }
      input {
        direction: ltr;
        text-align: left;
      }
      input:focus-visible,
      select:focus-visible,
      button:focus-visible {
        outline: 2px solid #729a7c;
        outline-offset: 2px;
      }
      .row {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }
      .row > div {
        flex: 1;
        min-width: 0;
      }
      select {
        font-size: 12px;
        padding-inline: 7px;
      }
      button {
        border: 0;
        cursor: pointer;
        padding: 11px 14px;
        font-weight: 600;
      }
      #submit {
        width: 100%;
        background: var(--accent);
        color: #fff;
        margin-top: 20px;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      fieldset:disabled {
        opacity: 0.65;
      }
      .secondary {
        background: var(--field);
        color: var(--text);
        border: 1px solid var(--line);
      }
      #status {
        min-height: 22px;
        line-height: 1.6;
        font-size: 12px;
        margin-top: 15px;
      }
      #status.error {
        color: var(--figma-color-text-danger, #bf4f3f);
      }
      #progress {
        width: 100%;
        height: 3px;
        accent-color: var(--accent);
        margin: 8px 0;
      }
      #cancel {
        padding: 5px 0;
        background: none;
        color: var(--muted);
        font-size: 12px;
      }
      #font-note {
        border: 1px solid var(--line);
        padding: 12px;
        border-radius: 8px;
        margin-top: 12px;
      }
      #font-note p {
        margin: 0 0 10px;
        color: var(--text);
        white-space: pre-line;
      }
      #font-folder {
        display: block;
        margin: 0 0 10px;
        font-size: 11px;
        word-break: break-all;
        user-select: all;
        text-align: left;
        color: var(--muted);
      }
      details {
        margin-top: 12px;
        font-size: 11px;
        color: var(--muted);
      }
      summary {
        cursor: pointer;
      }
      ul {
        padding-inline-start: 18px;
        margin-bottom: 0;
      }
      footer {
        padding: 8px 22px 16px;
        color: var(--muted);
        font-size: 10px;
        direction: ltr;
        text-align: left;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="brand">Website to Figma</div>
        <div class="by">By Hla.Sh</div>
      </div>
      <div class="mark" aria-hidden="true">↗</div>
    </header>
    <main>
      <h1>من الموقع إلى Figma</h1>
      <p>اختاري الإعدادات والصقي الرابط. يبدأ النسخ تلقائياً.</p>
      <form id="capture-form">
        <fieldset id="settings">
          <label for="url">رابط الموقع</label
          ><input
            id="url"
            type="url"
            placeholder="https://example.com"
            autocomplete="off"
            spellcheck="false"
            required
          />
          <div class="row">
            <div>
              <label for="size">المقاس</label
              ><select id="size">
                <option value="1440">Desktop · 1440</option>
                <option value="768">Tablet · 768</option>
                <option value="390">Mobile · 390</option>
                <option value="desktop-mobile">Desktop + Mobile</option>
                <option value="all">كل المقاسات</option>
              </select>
            </div>
            <div>
              <label for="theme">المظهر</label
              ><select id="theme">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
              </select>
            </div>
            <div>
              <label for="language">لغة الموقع</label
              ><select id="language">
                <option value="original">الأصلية</option>
                <option value="ar">العربية</option>
                <option value="en">English</option>
              </select>
            </div>
          </div>
        </fieldset>
        <button id="submit" type="button">نسخ إلى Figma</button>
      </form>
      <div id="status" role="status" aria-live="polite"></div>
      <progress id="progress" aria-label="تقدم النسخ" hidden></progress>
      <div id="font-note" hidden>
        <p id="font-message"></p>
        <code id="font-folder" dir="ltr" hidden></code>
        <button id="allow-fonts" class="secondary">متابعة بخط بديل</button>
      </div>
      <button id="cancel" hidden>إلغاء</button>
      <details id="notes" hidden>
        <summary>ملاحظات الدقة</summary>
        <ul id="note-list"></ul>
      </details>
    </main>
    <footer>__BUILD_VERSION__</footer>
    <!--SCRIPT-->
  </body>
</html>
